<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Documentary Studio</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 400px; margin: 40px auto; border: 1px solid #334155; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #334155; color: #fff; }
        button { background: #facc15; color: #000; font-weight: bold; cursor: pointer; font-size: 16px; }
        h2 { color: #facc15; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Vox-Style Studio</h2>
        <label style="display:block; text-align:left; font-size:14px;">1. ElevenLabs Voiceover (.mp3):</label>
        <input type="file" id="audio" accept="audio/*">
        
        <label style="display:block; text-align:left; font-size:14px; margin-top:10px;">2. Subtitles File (.srt):</label>
        <input type="file" id="srt" accept=".srt">

        <button onclick="alert('Vox Sync Engine Initialized!')">Generate Documentary</button>
    </div>
</body>
</html>
