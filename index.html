<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Vox Studio</title>
    <style>
        body { font-family: 'Arial Black', sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h1 { color: #facc15; font-size: 22px; text-transform: uppercase; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 12px; }
        label { font-size: 12px; color: #94a3b8; font-family: sans-serif; display: block; margin-bottom: 5px; }
        input[type="file"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        
        #preview-viewport { width: 100%; height: 280px; background: #000; border-radius: 8px; margin-top: 15px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid #facc15; }
        .bg-overlay { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; filter: contrast(120%); transition: transform 0.5s ease; }
        .word-box { position: relative; z-index: 10; background: #facc15; color: #000; padding: 6px 14px; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; box-shadow: 4px 4px 0px #000; transform: scale(1); animation: pop 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        button { width: 100%; background: #facc15; color: #000; padding: 12px; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        #status { font-family: sans-serif; color: #38bdf8; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Vox Pro Studio</h1>
    
    <div class="input-group">
        <label>1. Audio (.mp3):</label>
        <input type="file" id="audioInput" accept="audio/*">
    </div>

    <div class="input-group">
        <label>2. Subtitles (.srt):</label>
        <input type="file" id="srtInput" accept=".srt">
    </div>

    <div id="status">Upload files to sync</div>

    <div id="preview-viewport">
        <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600" class="bg-overlay" id="bgImg">
        <div class="word-box" id="wordText" style="display:none;">VOX</div>
    </div>

    <audio id="audioPlayer" controls style="display:none;"></audio>
    <button onclick="startSync()">Play Kinetic Vox Preview</button>
</div>

<script>
let wordsList = [];
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

document.getElementById('srtInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        parseSRTToWords(event.target.result);
    };
    reader.readAsText(file);
});

document.getElementById('audioInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if(!file) return;
    const player = document.getElementById('audioPlayer');
    player.src = URL.createObjectURL(file);
    document.getElementById('status').innerText = 'Audio Ready!';
});

function parseSRTToWords(data) {
    wordsList = [];
    const blocks = data.replace(/\r/g, '').split('\n\n');
    
    blocks.forEach(block => {
        const lines = block.split('\n');
        if (lines.length >= 3) {
            const time = lines[1].split(' --> ');
            if (time.length === 2) {
                const start = timeToSeconds(time[0]);
                const end = timeToSeconds(time[1]);
                const text = lines.slice(2).join(' ').trim();
                
                // Break sentence into individual word timestamps
                const words = text.split(' ');
                const durationPerWord = (end - start) / words.length;
                
                words.forEach((w, index) => {
                    wordsList.push({
                        start: start + (index * durationPerWord),
                        end: start + ((index + 1) * durationPerWord),
                        word: w
                    });
                });
            }
        }
    });
    document.getElementById('status').innerText = 'Subtitles Converted to ' + wordsList.length + ' Kinetic Words!';
}

function timeToSeconds(timeStr) {
    if(!timeStr) return 0;
    const p = timeStr.trim().replace(',', '.').split(':');
    return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
}

function playWhooshSFX() {
    // Generate synthetic pop/whoosh sound effect dynamically
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch(e){}
}

let lastWord = "";
function startSync() {
    audioCtx.resume();
    const audio = document.getElementById('audioPlayer');
    const wordBox = document.getElementById('wordText');
    const bgImg = document.getElementById('bgImg');
    
    if(!audio.src) { alert('Upload audio file first!'); return; }
    audio.play();

    audio.ontimeupdate = () => {
        const currentTime = audio.currentTime;
        const currentWordObj = wordsList.find(w => currentTime >= w.start && currentTime <= w.end);
        
        if (currentWordObj) {
            if(lastWord !== currentWordObj.word) {
                playWhooshSFX(); // SFX trigger per word
                lastWord = currentWordObj.word;
                bgImg.style.transform = `scale(${1 + (Math.random() * 0.15)}) rotate(${(Math.random() - 0.5) * 4}deg)`; // Subtle zoom effect
            }
            wordBox.innerText = currentWordObj.word;
            wordBox.style.display = 'inline-block';
        } else {
            wordBox.style.display = 'none';
        }
    };
}
</script>

</body>
</html>
